name: CI

on:
  push:
    branches: [master]
  workflow_dispatch:
  pull_request:
    branches: [master]

permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'

      # Builds the legacy WinForms exe and the SDK-style test project, then runs
      # the unit tests (Profile/ProfileManager/TabLayout/UiSettings core logic).
      - name: Restore
        run: dotnet restore ZenStatesDebugTool.sln

      - name: Build
        run: dotnet build ZenStatesDebugTool.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ZenStatesDebugTool.sln --configuration Release --no-build --verbosity normal
      - name: Package tested build
        shell: pwsh
        run: ./scripts/Package-Release.ps1 -OutputDirectory artifacts
      - name: Verify packaging failure paths
        shell: pwsh
        run: ./Tests/Package.Tests.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SMUDebugTool-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
