name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - name: Validate release history
        shell: pwsh
        run: |
          git merge-base --is-ancestor HEAD origin/master
          if ($LASTEXITCODE -ne 0) { throw 'Release commit is not on master.' }
      - run: dotnet restore ZenStatesDebugTool.sln
      - run: dotnet build ZenStatesDebugTool.sln -c Release --no-restore
      - run: dotnet test ZenStatesDebugTool.sln -c Release --no-build --verbosity normal
      - name: Package tested outputs
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/Package-Release.ps1 -OutputDirectory artifacts -Version ($env:RELEASE_TAG.Substring(1)) -RequireClean
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-package
          path: artifacts/*
          if-no-files-found: error
  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-package
          path: artifacts
      - name: Publish verified package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" artifacts/* --verify-tag --notes-file artifacts/RELEASE-NOTES.md --latest
